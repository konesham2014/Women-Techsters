<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="../../../components/sidebar/sidebar.css">
</head>
<body>

  <aside>
    <iframe src="../../../components/sidebar/sidebar.html" class="sidebar-frame"></iframe>
  </aside>

  <main class="content">
    <h1 id="greeting"></h1>
    <p class="subtitle">Here's what's happening with your productivity today</p>

    <section class="cards">

      <div class="card">
        <div class="icon blue">
          ✔
        </div>
        <h4>Active Tasks</h4>
        <h2 id="task-count">0</h2>
        <p>0 completed</p>
      </div>

      <div class="card">
        <div class="icon green">
          $
        </div>
        <h4>Total Expenses</h4>
        <h2>$0.00</h2>
        <p>This period</p>
      </div>

      <div class="card">
        <div class="icon yellow">
          📝
        </div>
        <h4>Total Notes</h4>
        <h2 id="note-count">0</h2>
        <p>Saved notes</p>
      </div>

      <div class="card">
        <div class="icon purple">
          📈
        </div>
        <h4>Completion Rate</h4>
        <h2>0%</h2>
        <p>Task completion</p>
      </div>

    </section>

    <section class="row">

      <div class="pane">
        <h3>Recent Tasks</h3>
        <div class="empty">No tasks yet</div>
      </div>

      <div class="pane actions">
        <h3>Quick Actions</h3>

        <div class="action-btn">
          ➕ Create New Task
        </div>

        <div class="action-btn">
          💰 Track Expense
        </div>

        <div class="action-btn">
          ✍️ Write Note
        </div>
      </div>

    </section>
  </main>

<script src="dashboard.js"></script>
<script src="../../../components/sidebar/sidebar.js"></script>
</body>
</html>
