<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TaskMaster - Login / Sign Up</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Background shapes (absolute positioned) -->
  <div class="bg">
    <!-- blue circle outline top-left -->
    <div class="shape circle-outline" aria-hidden="true"></div>

    <!-- large purple blurry blob (left mid) -->
    <div class="shape purple-blob" aria-hidden="true"></div>

    <!-- small blue blurry circle (left bottom) -->
    <div class="shape blue-blob" aria-hidden="true"></div>

    <!-- yellow blurry blob (right top) -->
    <div class="shape yellow-blob" aria-hidden="true"></div>

    <!-- green triangle (right upper area) - will move slightly -->
    <div class="shape green-triangle" aria-hidden="true"></div>

    <!-- purple triangle outline (right middle) - stroke only -->
    <svg class="shape purple-triangle-outline" viewBox="0 0 100 100" aria-hidden="true">
      <polygon points="50,5 95,95 5,95" fill="none" stroke="#A98CFF" stroke-width="3"/>
    </svg>
  </div>

  <!-- Centered page container -->
  <main class="page-wrap">
    <!-- Card: sizes will change depending on active view -->
    <section id="card" class="card signup-mode" aria-labelledby="title">
      <!-- Logo -->
      <div class="logo" style="width:82px; height:83px;">
        <div class="logo-box">
          <span class="check">✔</span>
          <div class="dot"></div>
        </div>
      </div>

      <h2 id="title">Join TaskMaster</h2>
      <p id="subtitle">Create an account to boost your productivity</p>

      <!-- Tabs -->
      <div class="tabs" style="width:404px; height:40px;">
        <button id="tab-login" class="tab">Login</button>
        <button id="tab-signup" class="tab active">Sign Up</button>

        <!-- inner active white pill that sits inside the tabs -->
        <div id="tab-indicator" class="tab-indicator" style="width:198px; height:30px;"></div>
      </div>

      <!-- Sign Up Form -->
      <form id="form-signup" class="form" autocomplete="off">
        <label class="label">Full Name*</label>
        <input id="signup-name" class="input" type="text" placeholder="Not Me" required />

        <label class="label">Email Address*</label>
        <input id="signup-email" class="input" type="email" placeholder="not@yopmail.com" required />

        <label class="label">Password*</label>
        <input id="signup-password" class="input" type="password" placeholder="Minimum 6 characters" minlength="6" required />

        <p class="note">Password must be at least 6 characters long</p>

        <div class="row">
          <button type="button" class="btn help" style="width:195px; height:50px;">Help?</button>
          <button id="create-btn" type="submit" class="btn primary" style="width:199px; height:50px;">Create Account</button>
        </div>
      </form>

      <!-- Login Form -->
      <form id="form-login" class="form hidden" autocomplete="off">
        <label class="label">Email Address*</label>
        <input id="login-email" class="input" type="email" placeholder="e@yopmail.com" required />

        <label class="label">Password*</label>
        <input id="login-password" class="input" type="password" required />

        <div class="row">
          <button type="button" class="btn help" style="width:195px; height:50px;">Help?</button>
          <button id="next-btn" type="submit" class="btn primary" style="width:199px; height:50px;">Next Step</button>
        </div>
      </form>

      <p class="footer">By continuing, you agree to our <a href="#">Terms of Service</a> & <a href="#">Privacy Policy</a></p>
      <p class="copyright">© 2024 TaskMaster | Made for University Students</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
